<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estado de tu pedido | ELIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#F9F9F6] text-black font-sans antialiased">

  <a href="#contenido" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:border focus:border-black focus:bg-white focus:px-4 focus:py-2">Saltar al contenido</a>

  <header id="site-header"></header>

  <main id="contenido" class="mx-auto max-w-3xl px-4 py-8 lg:py-12">

    <section id="ok" class="hidden" aria-labelledby="h1">
      <h1 id="h1" tabindex="-1" class="text-3xl font-semibold uppercase tracking-tight lg:text-4xl">Estado de tu pedido</h1>
      <p class="mt-3">Pedido <strong id="num"></strong></p>
      <p id="actual" role="status" class="mt-2 flex items-center gap-2 font-medium"></p>
      <p class="mt-1 text-sm">Entrega estimada: 3 a 5 días hábiles.</p>

      <ol id="linea" class="mt-8 space-y-0" aria-label="Seguimiento del pedido"></ol>

      <div class="mt-6">
        <button type="button" id="sim" class="border border-black bg-white px-6 py-3 text-sm font-medium transition-colors hover:bg-black hover:text-white">Simular el siguiente estado</button>
      </div>

      <div class="mt-10 bg-white p-6 shadow-[0_1px_2px_rgba(0,0,0,0.06)]">
        <h2 class="text-lg font-semibold uppercase tracking-wide">Resumen</h2>
        <ul id="items" class="mt-4 divide-y divide-black/10"></ul>
        <dl class="mt-4 space-y-2 border-t border-black/10 pt-4 text-sm">
          <div class="flex justify-between"><dt>Subtotal</dt><dd id="r-sub"></dd></div>
          <div class="flex justify-between"><dt>Envío</dt><dd id="r-env"></dd></div>
          <div class="flex justify-between text-base font-bold"><dt>Total del pedido</dt><dd id="r-tot"></dd></div>
        </dl>
      </div>
      <a href="index.html#catalogo" class="mt-8 inline-block text-sm underline underline-offset-4">Seguir comprando</a>
    </section>

    <section id="nada" class="hidden bg-white p-8 text-center shadow-[0_1px_2px_rgba(0,0,0,0.06)]">
      <h1 class="text-2xl font-semibold">Aún no tienes pedidos</h1>
      <p class="mt-2">Cuando completes una compra, podrás ver aquí cómo va tu pedido.</p>
      <a href="index.html#catalogo" class="mt-6 inline-block border border-black bg-white px-8 py-3 text-sm tracking-wide transition-colors hover:bg-black hover:text-white">Ver catálogo</a>
    </section>
  </main>

  <footer></footer>

  <script src="reglas.js"></script>
  <script src="api.js"></script>
  <script src="elive.js"></script><script src="login.js"></script>
  <script src="pages/pedido.js"></script>
</body>
</html>
